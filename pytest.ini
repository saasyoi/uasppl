[pytest]
# Konfigurasi pytest untuk DamnCRUD Functional Testing
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)s] %(message)s
log_date_format = %H:%M:%S

# Agar test tidak saling mengganggu saat paralel
# (setiap worker punya context terpisah karena driver-nya di setup_method)
addopts = -v --tb=short
